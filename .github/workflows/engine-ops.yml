# ChatOps — the only interface you need after setup.
# Comment on an issue: /bootstrap, /packet <stage>, /ingest (+ pasted artifact),
# /approve, /sync <path>, /pages [P0], /factor, /help.
# Issue forms "[NEW PROJECT]" and "[TRUTH]" are processed on open.
name: Engine ops
on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write
jobs:
  ops:
    if: ${{ github.event.issue.pull_request == null && (github.event_name == 'issues' || startsWith(github.event.comment.body, '/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Route command
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QC_MODEL: ${{ vars.QC_MODEL }}
        run: python engine/scripts/engine_ops.py
