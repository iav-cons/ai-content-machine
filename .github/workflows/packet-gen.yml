# Job packet generation from the GitHub UI (spec §10, §22): Actions tab →
# "Generate job packet" → Run workflow. The packet is built from the canonical
# files on main, posted to the given issue (manual-worker bridge, spec §11) and
# attached as a workflow artifact.
name: Generate job packet
on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project id (folder under projects/)"
        required: true
      stage:
        description: "entity_research | content_cluster | url_map | query_triage | serp_research | brief | content | page_review"
        required: true
      page_id:
        description: "Page ID (required for serp_research/brief/content)"
        required: false
      attempt:
        description: "Attempt number (1-3)"
        required: false
        default: "1"
      issue_number:
        description: "Issue to post the packet to (optional — manual-worker bridge)"
        required: false
      slim:
        description: "Slim session packet (project chat already bootstrapped)"
        type: boolean
        default: true
      skip_triage:
        description: "Brief only: consciously proceed without an approved triage"
        type: boolean
        default: false
permissions:
  contents: read
  issues: write
jobs:
  packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # packets are ALWAYS built from canonical main (spec §16)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Build packet
        run: |
          ARGS="--project '${{ github.event.inputs.project_id }}' --stage '${{ github.event.inputs.stage }}' --attempt '${{ github.event.inputs.attempt }}'"
          if [ -n "${{ github.event.inputs.page_id }}" ]; then ARGS="$ARGS --page-id '${{ github.event.inputs.page_id }}'"; fi
          if [ "${{ github.event.inputs.slim }}" = "true" ]; then ARGS="$ARGS --slim"; fi
          if [ "${{ github.event.inputs.skip_triage }}" = "true" ]; then ARGS="$ARGS --skip-triage"; fi
          eval python engine/scripts/make_packet.py $ARGS --stdout > packet.md
          echo "Packet size: $(wc -c < packet.md) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: job-packet
          path: packet.md
      - name: Post packet to issue (manual-worker bridge, spec §11)
        if: ${{ github.event.inputs.issue_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "**Job packet** (status: \`awaiting_manual_worker\` — spec §11). Copy everything in the block below into the worker, then return the result as a new branch + PR."
            echo ""
            echo '``````'
            cat packet.md
            echo '``````'
          } > comment.md
          gh issue comment "${{ github.event.inputs.issue_number }}" --repo "${{ github.repository }}" --body-file comment.md \
            || echo "Comment failed (packet may exceed the comment size limit) — download the workflow artifact instead."
